name: Package APK only (7z)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/split-release-artifacts.yml"

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download verified build from run 45061020860
        uses: actions/download-artifact@v4
        with:
          name: lethal-offline-mobile-low
          repository: ${{ github.repository }}
          run-id: 45061020860
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Verify APK and create archive containing only the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="LethalOffline-MobileLow.apk"
          test -s "downloaded/$APK"
          test -s "downloaded/LethalOffline-MobileLow.apk.sha256"

          EXPECTED="$(awk '{print $1}' downloaded/LethalOffline-MobileLow.apk.sha256)"
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "downloaded/$APK" | sha256sum -c -

          mkdir -p release extracted
          (
            cd downloaded
            7z a -t7z -m0=lzma2 -mx=5 -mmt=on "../release/LethalOffline-MobileLow-APK.7z" "$APK"
          )
          7z t release/LethalOffline-MobileLow-APK.7z
          7z x -y -orextracted release/LethalOffline-MobileLow-APK.7z
          EXTRACTED="$(find extracted -type f -name "$APK" -print -quit)"
          test -n "$EXTRACTED"
          cmp "downloaded/$APK" "$EXTRACTED"
          test "$(find extracted -type f | wc -l)" -eq 1
          sha256sum "$EXTRACTED" | tee release/LethalOffline-MobileLow-APK.sha256
          stat -c 'APK bytes: %s' "downloaded/$APK"
          stat -c '7z bytes: %s' "release/LethalOffline-MobileLow-APK.7z"
          7z l -ba release/LethalOffline-MobileLow-APK.7z

      - name: Upload compressed APK only
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-mobile-low-apk-only-7z
          path: release/LethalOffline-MobileLow-APK.7z
          compression-level: 0
          retention-days: 30
