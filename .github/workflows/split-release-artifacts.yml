name: Split Lethal Offline release artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/split-release-artifacts.yml"

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download completed release artifact
        uses: actions/download-artifact@v4
        with:
          name: lethal-offline-mobile-low
          repository: ${{ github.repository }}
          run-id: 45061020860
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded

      - name: Verify and split release files
        run: |
          set -euo pipefail
          test -s downloaded/LethalOffline-MobileLow.7z
          test -s downloaded/LethalOffline-MobileLow.apk
          7z t downloaded/LethalOffline-MobileLow.7z
          (cd downloaded && sha256sum -c <(sed 's#output/##g' LethalOffline-MobileLow.apk.sha256))
          mkdir -p release/apk release/archive release/report
          cp downloaded/LethalOffline-MobileLow.apk release/apk/
          sed 's#output/##g' downloaded/LethalOffline-MobileLow.apk.sha256 > release/apk/LethalOffline-MobileLow.apk.sha256
          cp downloaded/LethalOffline-MobileLow.7z release/archive/
          cp downloaded/optimization-report.json downloaded/apk-badging.txt downloaded/LEEME.txt release/report/
          du -h release/apk/* release/archive/* release/report/*

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-mobile-low-apk
          path: release/apk/*
          compression-level: 0
          retention-days: 30

      - name: Upload requested 7z only
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-mobile-low-7z
          path: release/archive/*
          compression-level: 0
          retention-days: 30

      - name: Upload optimization report
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-mobile-low-report
          path: release/report/*
          compression-level: 6
          retention-days: 30
