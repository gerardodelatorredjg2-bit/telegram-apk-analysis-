name: Read-only Unity scene and camera audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_unity_scenes.py"
      - ".github/workflows/audit-unity-scenes.yml"

permissions:
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@v4

      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p input work/apk output

      - name: Download preserved original APK
        uses: actions/download-artifact@v4
        with:
          name: original-apk
          repository: ${{ github.repository }}
          run-id: 45057515185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input

      - name: Extract and reassemble Unity data
        run: |
          set -euo pipefail
          test -s input/original.apk
          unzip -q input/original.apk -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("work/apk/assets/bin/Data")
          groups = {}
          for path in root.iterdir():
              match = re.fullmatch(r"(.+)\.split(\d+)", path.name)
              if match:
                  groups.setdefault(match.group(1), []).append((int(match.group(2)), path))
          for name, chunks in sorted(groups.items()):
              chunks.sort()
              indices = [index for index, _ in chunks]
              if indices != list(range(indices[-1] + 1)):
                  raise SystemExit(f"Missing chunk in {name}: {indices}")
              target = root / name
              with target.open("wb") as destination:
                  for _, chunk in chunks:
                      with chunk.open("rb") as source:
                          while block := source.read(8 * 1024 * 1024):
                              destination.write(block)
              for _, chunk in chunks:
                  chunk.unlink()
          PY

      - name: Install UnityPy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UnityPy dependencies
        run: python -m pip install --disable-pip-version-check "UnityPy==1.25.4"

      - name: Inspect all serialized scenes
        run: python scripts/audit_unity_scenes.py

      - name: Upload read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: unity-scene-camera-audit
          path: |
            output/scene-camera-audit.json
            output/scene-camera-audit.md
          retention-days: 30
