name: Read-only Unity scene and camera audit

on:
  workflow_dispatch:
  push:
    branches:
      - ui-controls-redesign-prototype
    paths:
      - "scripts/audit_unity_scenes.py"
      - ".github/workflows/audit-unity-scenes.yml"

permissions:
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p input work/apk work/output output

      - name: Download preserved original APK
        uses: actions/download-artifact@v4
        with:
          name: original-apk
          repository: ${{ github.repository }}
          run-id: 45057515185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input

      - name: Extract and reassemble Unity data
        run: |
          set -euo pipefail
          test -s input/original.apk
          unzip -q input/original.apk -d work/apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("work/apk/assets/bin/Data")
          groups={}
          for p in root.iterdir():
    m=re.fullmatch(r"(.+)\.split(\d+)",p.name)
              if m:
                  groups.setdefault(m.group(1),[]).append((int(m.group(2)),p))
          for name,chunks in sorted(groups.items()):
              chunks.sort()
              ids=[i for i,_ in chunks]
              if ids != list(range(ids[-1]+1)):
                  raise SystemExit(f"Missing chunk in {name}: {ids}")
              target=root/name
              with target.open("wb") as dst:
                  for _,chunk in chunks:
                      with chunk.open("rb") as src:
                          while block:=src.read(8*1024*1024):
                              dst.write(block)
              for _,chunk in chunks:
                  chunk.unlink()
          PY

      - name: Install UnityPy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UnityPy dependencies
        run: python -m pip install --disable-pip-version-check "UnityPy==1.25.4"
      - name: Inspect all serialized scenes
        run: python scripts/audit_unity_scenes.py

      - name: Upload read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: unity-scene-camera-audit
          path: |
            output/scene-camera-audit.json
            output/scene-camera-audit.md
          retention-days: 30
