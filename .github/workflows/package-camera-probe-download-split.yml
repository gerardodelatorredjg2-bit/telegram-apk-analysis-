name: Package original-fidelity camera probe (split download)

on:
  push:
    paths:
      - ".github/workflows/package-camera-probe-download-split.yml"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p input package

      - name: Download already verified camera-probe build
        uses: actions/download-artifact@v4
        with:
          name: lethal-offline-original-fidelity-camera-probe
          repository: ${{ github.repository }}
          run-id: 45090036861
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input

      - name: Verify inputs and create two 350 MiB 7z volumes
        run: |
          set -euo pipefail
          APK="input/LethalOffline-OriginalFidelity-CameraProbe.apk"
          test -s "$APK"
          test -s input/LethalOffline-OriginalFidelity-CameraProbe.apk.sha256
          test -s input/camera-probe-report.json
          test -s input/apk-badging.txt
          7z a -t7z -m0=lzma2 -mx=3 -mmt=on -v350m \
            package/LethalOffline-OriginalFidelity-CameraProbe.7z \
            "$APK" \
            input/LethalOffline-OriginalFidelity-CameraProbe.apk.sha256 \
            input/camera-probe-report.json \
            input/apk-badging.txt
          test -s package/LethalOffline-OriginalFidelity-CameraProbe.7z.001
          test -s package/LethalOffline-OriginalFidelity-CameraProbe.7z.002
          7z t package/LethalOffline-OriginalFidelity-CameraProbe.7z.001
          (cd package && sha256sum LethalOffline-OriginalFidelity-CameraProbe.7z.001 LethalOffline-OriginalFidelity-CameraProbe.7z.002 > volumes.sha256)
          cat > package/README-DOWNLOAD.txt <<'EOF'
          LETHAL OFFLINE — ORIGINAL-FIDELITY CAMERA PROBE
          
          This is a TEST CANDIDATE, not a confirmed gameplay fix.
          It starts from the preserved original APK and changes only the four
          player MainCamera nearClipPlane values in Unity scene level3:
          0.05 -> 0.10.
          
          Download BOTH files:
          LethalOffline-OriginalFidelity-CameraProbe.7z.001
          LethalOffline-OriginalFidelity-CameraProbe.7z.002
          
          Keep both volumes in the same folder. On Android, open the .001 file
          with ZArchiver or another 7-Zip-compatible archiver and extract.
          On Windows, use 7-Zip to open/extract the .001 file.
          
          Verify the two downloaded volume files against volumes.sha256.
          The extracted APK is signed with a new community test key. Uninstall
          any prior copy signed with a different key before installing.
          
          Device testing is still required for the black-geometry symptom.
          This candidate does not claim to fix fog, spectator, chat, terminal,
          HUD integration, audio, microphone, or multiplayer.
          EOF
          ls -lh package/*

      - name: Upload volume 001
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-camera-probe-volume-001
          path: package/LethalOffline-OriginalFidelity-CameraProbe.7z.001
          compression-level: 0
          retention-days: 30

      - name: Upload volume 002
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-camera-probe-volume-002
          path: package/LethalOffline-OriginalFidelity-CameraProbe.7z.002
          compression-level: 0
          retention-days: 30

      - name: Upload checksums and instructions
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-camera-probe-download-manifest
          path: |
            package/volumes.sha256
            package/README-DOWNLOAD.txt
          retention-days: 30
