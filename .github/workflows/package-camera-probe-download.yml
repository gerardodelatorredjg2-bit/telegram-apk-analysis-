name: Package original-fidelity camera probe for download (split volumes)

on:
  push:
    paths:
      - ".github/workflows/package-camera-probe-download.yml"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p input package

      - name: Download verified camera-probe artifact
        uses: actions/download-artifact@v4
        with:
          name: lethal-offline-original-fidelity-camera-probe
          repository: ${{ github.repository }}
          run-id: 45090036861
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input

      - name: Verify source and create split archive
        run: |
          set -euo pipefail
          APK="input/LethalOffline-OriginalFidelity-CameraProbe.apk"
          test -s "$APK"
          test -s input/LethalOffline-OriginalFidelity-CameraProbe.apk.sha256
          test -s input/camera-probe-report.json
          test -s input/apk-badging.txt

          7z a -t7z -m0=lzma2 -mx=3 -mmt=on -v350m \
            package/LethalOffline-OriginalFidelity-CameraProbe.7z \
            "$APK" \
            input/LethalOffline-OriginalFidelity-CameraProbe.apk.sha256 \
            input/camera-probe-report.json \
            input/apk-badging.txt

          test -s package/LethalOffline-OriginalFidelity-CameraProbe.7z.001
          test -s package/LethalOffline-OriginalFidelity-CameraProbe.7z.002
          7z t package/LethalOffline-OriginalFidelity-CameraProbe.7z.001
          (cd package && sha256sum \
            LethalOffline-OriginalFidelity-CameraProbe.7z.001 \
            LethalOffline-OriginalFidelity-CameraProbe.7z.002 > volumes.sha256)

          cp input/LethalOffline-OriginalFidelity-CameraProbe.apk.sha256 package/candidate-apk.sha256
          cp input/camera-probe-report.json package/camera-probe-report.json
          cp input/apk-badging.txt package/apk-badging.txt
          candidate_sha="$(awk '{print $1}' package/candidate-apk.sha256)"
          candidate_bytes="$(stat -c '%s' "$APK")"
          original_sha="$(python3 -c 'import json; print(json.load(open("package/camera-probe-report.json"))["original_apk_sha256"])')"

          cat > package/README-DOWNLOAD.txt <<EOF
          LETHAL OFFLINE — ORIGINAL-FIDELITY CAMERA PROBE

          THIS IS A TEST CANDIDATE, NOT A CONFIRMED GAMEPLAY FIX.
          It starts from the preserved original APK and changes only the four
          player MainCamera nearClipPlane values in Unity scene level3:
          0.05 -> 0.10.

          Original APK SHA-256: $original_sha
          Candidate signed APK size: $candidate_bytes bytes
          Candidate signed APK SHA-256: $candidate_sha

          Download BOTH volumes and keep them in the same folder:
          LethalOffline-OriginalFidelity-CameraProbe.7z.001
          LethalOffline-OriginalFidelity-CameraProbe.7z.002

          On Android, open the .001 file with ZArchiver or another 7-Zip-
          compatible archiver and extract. On Windows, use 7-Zip to extract
          starting from the .001 file. Verify both volumes with volumes.sha256.

          The extracted APK is signed with a new community test key. Uninstall
          any prior copy signed with a different key before installing.

          Device testing is still required for the black-geometry symptom.
          This candidate does not claim to fix fog, spectator, chat, terminal,
          HUD integration, audio, microphone, or multiplayer.
          EOF
          ls -lh package/*

      - name: Upload archive volume 001
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-camera-probe-volume-001
          path: package/LethalOffline-OriginalFidelity-CameraProbe.7z.001
          compression-level: 0
          retention-days: 30

      - name: Upload archive volume 002
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-camera-probe-volume-002
          path: package/LethalOffline-OriginalFidelity-CameraProbe.7z.002
          compression-level: 0
          retention-days: 30

      - name: Upload checksums and installation notes
        uses: actions/upload-artifact@v4
        with:
          name: lethal-offline-camera-probe-download-manifest
          path: |
            package/volumes.sha256
            package/README-DOWNLOAD.txt
            package/candidate-apk.sha256
            package/camera-probe-report.json
            package/apk-badging.txt
          retention-days: 30
