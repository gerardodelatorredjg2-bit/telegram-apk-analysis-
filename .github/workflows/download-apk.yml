name: Download original APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/download-apk.yml"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from temporary source
        run: |
          set -euo pipefail
          URL='https://geradololiconkpol-ia-telegranm.hf.space/d/lTyJkc6DioJVi0S2WPhnqCmHycnylZSOZ7qSHuqAifs'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o original.apk
          file original.apk
          test -s original.apk
          stat -c 'Downloaded APK size: %s bytes' original.apk
          sha256sum original.apk > original.apk.sha256
      - name: Save APK and checksum as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: original-apk
          path: |
            original.apk
            original.apk.sha256
          retention-days: 30
